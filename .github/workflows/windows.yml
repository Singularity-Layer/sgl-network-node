# Windows build pipeline — proves the `sgl` node agent compiles + packages on
# Windows (x86_64-pc-windows-msvc) using GitHub's own Windows runners.
#
# This is the runtime half of shipping a Windows node app: the desktop shell
# builds on Windows in its own repo; this workflow proves the actual node binary
# it drives (`sgl.exe`) compiles and can be packaged as a verifiable artifact.
#
# Triggers:
#   - pull_request / workflow_dispatch → BUILD ONLY (compile + upload sgl.exe).
#   (No `v*` tag trigger: release.yml's build-windows job builds + publishes the
#    Windows binary onto the release, so a tag doesn't double-build here.)
#
# Deliberately BUILD-ONLY: we compile + package, we do NOT run the node (a real
# Windows box is an owner follow-up). The `inprocess` feature is NOT enabled on
# Windows yet (it vendors + builds llama.cpp via cmake; Windows nodes use the
# child-process `--engine=server` path with llama-server.exe). Windows nodes are
# non-confidential (no TEE/App Attest), which matches the product framing.

name: windows

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (sgl-windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # `ring` (pulled in transitively by rustls, via reqwest rustls-tls +
      # tokio-tungstenite) assembles its crypto with NASM on the MSVC target.
      # windows-latest usually ships nasm, but pin it so the build can't go red
      # if the runner image drops it.
      - name: Install NASM (for ring's assembly)
        uses: ilammy/setup-nasm@v1

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Suffix bumped deliberately. llama-cpp-sys-2 sets .always_configure(false), and
          # cmake-rs SKIPS configure entirely when CMakeCache.txt exists — so a target/ dir
          # cached from a /MD configure silently ignores a new runtime define and the change
          # looks like it did nothing. Bump this whenever the CMake flags change.
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-crtmt-v1
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-crtmt-
            ${{ runner.os }}-cargo-

      - name: Build (release, MSVC)
        # Static CRT: link the MSVC C runtime into the binary so sgl.exe has zero DLL
        # dependencies. Without this, clean Windows installs (no VC++ Redistributable)
        # die at launch with "VCRUNTIME140.dll was not found".
        #
        # IN-PROCESS ON WINDOWS. The blocker was a C-runtime mismatch, not Windows: Rust
        # links /MT (above) while llama.cpp's CMake half built /MD, giving
        #   LNK2038: 'MT_StaticRelease' doesn't match 'MD_DynamicRelease' in llama-sampler.obj
        #
        # LLAMA_STATIC_CRT does NOT fix it. cmake-rs's static_crt() only feeds its internal
        # cc configs and injects CMAKE_C_FLAGS; it never sets CMAKE_MSVC_RUNTIME_LIBRARY. And
        # under policy CMP0091 (NEW — llama.cpp requires cmake >= 3.14...3.28) the runtime is
        # chosen by that PROPERTY, not by flags, so a textual /MT in CMAKE_C_FLAGS loses.
        #
        # llama-cpp-sys-2's build.rs forwards any CMAKE_* env var as a -D define, so setting
        # the property here reaches CMake without patching or forking the crate.
        # CFLAGS/CXXFLAGS still matter: the mtmd/clip/siglip sources are compiled by the `cc`
        # crate, which never sees the CMake property.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CFLAGS: /MT
          CXXFLAGS: /MT
        run: cargo build --release --target x86_64-pc-windows-msvc --features inprocess,vision

      - name: Checksum
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/sgl.exe"
          if (-not (Test-Path $bin)) { throw "sgl.exe was not produced at $bin" }
          $hash = (Get-FileHash -Algorithm SHA256 $bin).Hash.ToLower()
          "$hash  sgl-windows-x86_64.exe" | Out-File -Encoding ascii "sgl-windows-x86_64.exe.sha256"
          Get-Content "sgl-windows-x86_64.exe.sha256"
          Copy-Item $bin "sgl-windows-x86_64.exe"

      # "It links" is not "it runs". Twice on Linux a build went green and the binary then
      # would not START on a clean host (libgomp.so.1, then libvulkan.so.1) because the
      # loader fails before main(). These two gates are the Windows equivalent.
      - name: Assert zero non-OS DLL imports
        shell: pwsh
        run: |
          $dumpbin = (Get-ChildItem -Recurse -Filter dumpbin.exe `
            "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue |
            Select-Object -First 1).FullName
          if (-not $dumpbin) { Write-Host "dumpbin not found - skipping"; exit 0 }
          $out = & $dumpbin /DEPENDENTS sgl-windows-x86_64.exe
          Write-Host $out
          $bad = $out | Select-String -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase|vcomp'
          if ($bad) { throw "sgl.exe imports a non-OS runtime DLL - it will not start on a clean Windows box: $bad" }
          Write-Host "OK: no VC++ runtime imports"

      - name: Run on a clean Windows image (no VC++ redistributable)
        shell: pwsh
        continue-on-error: true
        run: |
          # Server Core has the OS UCRT but NOT the VC++ redistributable - the clean-box
          # profile an operator actually has. A /MD binary dies here with 0xC0000135.
          docker run --rm -v "${PWD}:C:\w" mcr.microsoft.com/windows/servercore:ltsc2025 `
            C:\w\sgl-windows-x86_64.exe --version

      # PROVE THE ENGINE WORKS, not just that the binary starts. A build can link cleanly,
      # pass the DLL gate, run --version, and still be unable to load a model or produce a
      # tool call.
      #
      # This gate deliberately does NOT assert an exact completion-token count across
      # platforms. An earlier version did, and it was wrong: greedy decoding is not
      # bit-identical across ISAs. The x86-64 MSVC baseline is SSE2 with NO fused
      # multiply-add, so every multiply-add rounds twice, while the arm64 builds use NEON
      # with fused FMA that rounds once. On a near-tied logit the argmax legitimately flips,
      # and Windows produced prose where arm64 produced a tool call - on ONE prompt, while
      # matching arm64 token-for-token on another. That is model behaviour, not a bug.
      # (The prompt also embeds today's date via the chat template, so "the same prompt" is
      # not even byte-stable across days or timezones.)
      #
      # Billing correctness is "billed == produced", which holds regardless. Identical counts
      # across platforms was never the invariant, and claiming it was an overreach.
      #
      # What IS deterministic, and what we therefore assert: on ONE machine with ONE binary
      # at temperature 0, the streaming and non-streaming paths share a decode loop and must
      # agree exactly. Plus the behaviour that actually matters - a real tool call comes back.
      - name: Build the engine probe
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CFLAGS: /MT
          CXXFLAGS: /MT
        run: cargo build --release --target x86_64-pc-windows-msvc --features inprocess,vision --example tool_probe

      - name: Run real inference through the in-process engine
        shell: pwsh
        run: |
          $url = "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
          Invoke-WebRequest -Uri $url -OutFile model.gguf -UseBasicParsing
          $probe = "target/x86_64-pc-windows-msvc/release/examples/tool_probe.exe"
          if (-not (Test-Path $probe)) { throw "probe not built at $probe" }
          $out = & $probe model.gguf 2>&1 | Out-String
          Write-Host $out

          # 1. The engine loaded and knows what syntax this model speaks.
          if ($out -notmatch 'tool_format detected: Llama3Json') { throw "tool format not detected on Windows" }

          # 2. A REAL tool call came back, with the right name and a usable argument.
          if ($out -notmatch 'finish_reason : Some\("tool_calls"\)') { throw "no tool call produced on Windows" }
          if ($out -notmatch 'get_weather')                          { throw "tool name missing from the call" }
          if ($out -notmatch '\\"city\\"')                            { throw "tool call carried no city argument" }

          # 3. SAME-MACHINE PARITY - the real invariant. Both paths now use the same prompt,
          #    same binary, same backend, temperature 0, so they are deterministic and MUST
          #    agree. A mismatch here is a genuine bug in one of the two paths.
          $ns = [regex]::Match($out, 'tokens\s+:\s+(\d+) prompt / (\d+) completion')
          $st = [regex]::Match($out, 'stream usage\s+:\s+Some\((\d+), (\d+)\)')
          if (-not $ns.Success -or -not $st.Success) { throw "could not read token counts from the probe" }
          if ($ns.Groups[1].Value -ne $st.Groups[1].Value) {
            throw "PROMPT TOKENS DIFFER between paths on one machine: $($ns.Groups[1].Value) vs $($st.Groups[1].Value) - the two paths render different prompts"
          }
          $nsc = [int]$ns.Groups[2].Value
          if ($nsc -lt 1 -or $nsc -ge 80) { throw "completion tokens $nsc hit the cap - the model never finished a tool call" }
          Write-Host "OK: Windows in-process engine produced a real tool call; both paths agree on prompt tokens ($($ns.Groups[1].Value))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgl-windows-x86_64
          path: |
            sgl-windows-x86_64.exe
            sgl-windows-x86_64.exe.sha256
          if-no-files-found: error

      # The MSVC runtime trio (officially redistributable) — hosted on our R2 and dropped
      # by `sgl setup` NEXT TO llama-server.exe, so upstream llama.cpp builds run on clean
      # Windows installs without the VC++ Redistributable (beta testers hit
      # "VCRUNTIME140.dll was not found" otherwise). Packaged from the runner's VS redist.
      - name: Package MSVC runtime DLLs (vccrt-x64.zip)
        shell: pwsh
        run: |
          # System32 carries the same (newest-installed) redistributable DLLs and exists on
          # every runner image — unlike the VS Redist folder layout, which moves around.
          $src = Join-Path $env:SystemRoot "System32"
          New-Item -ItemType Directory -Path vccrt-x64 | Out-Null
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            $p = Join-Path $src $d
            if (-not (Test-Path $p)) { throw "$d not found in System32" }
            Copy-Item $p vccrt-x64
            Write-Host "$d $((Get-Item $p).VersionInfo.ProductVersion)"
          }
          Compress-Archive -Path "vccrt-x64\*" -DestinationPath "vccrt-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "vccrt-x64.zip").Hash.ToLower()
          "$hash  vccrt-x64.zip" | Out-File -Encoding ascii "vccrt-x64.zip.sha256"
          Get-Content "vccrt-x64.zip.sha256"

      - name: Upload CRT artifact
        uses: actions/upload-artifact@v4
        with:
          name: vccrt-x64
          path: |
            vccrt-x64.zip
            vccrt-x64.zip.sha256
          if-no-files-found: error
