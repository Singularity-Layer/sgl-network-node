# Release pipeline — builds official binaries on GitHub's own runners.
#
# Trigger: push a version tag (v1.2.0, v1.3.0, …).
# Output: ONE GitHub PRERELEASE with one binary + .sha256 per platform:
#   sgl-darwin-arm64        (macOS Apple Silicon)
#   sgl-linux-x86_64        (Linux x86_64 — Intel TDX / AMD SEV hosts)
#   sgl-linux-arm64         (Linux arm64)
#   sgl-windows-x86_64.exe  (Windows x64 — non-confidential node)
#
# Why CI builds: binaries are produced from the public source on GitHub's
# infrastructure, not a developer laptop — a verifiable supply chain. After a
# release, each new sha256 must be appended to the orchestrator's
# ALLOWED_NODE_BINARY_HASHES (add-before-remove) or the build cannot serve.
#
# NON-PUBLIC BY DESIGN: the release is a `--prerelease` and this repo is PRIVATE,
# so assets are not anonymously downloadable. Nothing reaches the public download
# endpoint (cloud.x402compute.cc/downloads/node/) until the owner syncs manually.
# The Windows binary additionally does nothing until the owner allowlists its
# sha256 — see WINDOWS.md / RELEASING.md.

name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger so a build can be PROVEN before it is released. Without this the only
  # way to test a toolchain change (e.g. compiling llama.cpp in-process for a new platform)
  # was to tag, which is why operators saw a run of releases in a single day.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      # A Linux build hiccup must NOT cancel the macOS binary. macOS is every live grid node,
      # and Linux is newly compiling llama.cpp in-process here, so it is the likeliest to break.
      fail-fast: false
      matrix:
        include:
          # macOS = every live grid node. Build with in-process inference (v1.5.0)
          # + Metal so SGL_ENGINE=inprocess works out of the box (vendors llama.cpp
          # via cmake, preinstalled on macos-14 runners).
          - os: macos-14
            target: aarch64-apple-darwin
            asset: sgl-darwin-arm64
            features: "inprocess,metal,vision"
          # Linux ships the in-process engine COMPILED IN but NOT as the default (see the
          # engine selection in node.rs). Compiling in CI does not prove runtime behaviour on
          # real hardware, and flipping the default blind would move every Linux node onto an
          # untested inference path at once. Operators opt in with SGL_ENGINE=inprocess; the
          # default flips once it is validated on a real Linux node.
          # CPU-only, deliberately. Building with `vulkan` DOES work (headers + glslc +
          # spirv-headers on the runner) and gives the in-process engine GPU acceleration - but
          # the resulting binary hard-links libvulkan.so.1 and then will not START on a machine
          # without the Vulkan runtime. Verified in a bare container: "error while loading
          # shared libraries: libvulkan.so.1". That would fix GPU nodes by bricking every
          # CPU-only node, which is a worse trade. Binary also grows 16M -> 44M.
          # Proper fix is a dynamically-loaded backend (llama-cpp-2 has `dynamic-backends`) or
          # a separate GPU artifact chosen at install, like setup.rs already does with
          # engine.variant. Until then Linux keeps the server engine as its default.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: sgl-linux-x86_64
            features: "inprocess,vision"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: sgl-linux-arm64
            features: "inprocess,vision"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package + checksum
        run: |
          cp "target/${{ matrix.target }}/release/sgl" "${{ matrix.asset }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  # Windows is a separate job (MSVC toolchain + NASM for `ring`; PowerShell
  # checksum). Mirrors windows.yml's build so the Windows node binary rides the
  # same release. Non-confidential (no TEE/App Attest), which matches the product
  # framing — see WINDOWS.md.
  build-windows:
    name: build (sgl-windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # `ring` (via rustls → reqwest rustls-tls + tokio-tungstenite) assembles its
      # crypto with NASM on the MSVC target. Pin it so the build can't go red if
      # the runner image ever drops nasm.
      - name: Install NASM (for ring's assembly)
        uses: ilammy/setup-nasm@v1

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release, MSVC)
        # Static CRT: link the MSVC C runtime into the binary so sgl.exe has zero DLL
        # dependencies. Without this, clean Windows installs (no VC++ Redistributable)
        # die at launch with "VCRUNTIME140.dll was not found".
        #
        # In-process inference on Windows is NOT enabled yet. It is a C-runtime mismatch, not
        # a Windows limitation: Rust links the static CRT (/MT) above, llama.cpp's cmake half
        # builds /MD, and they fail to link (LNK2038 on llama-sampler.obj). CFLAGS/CXXFLAGS=/MT
        # fixes the cc-crate half (mtmd/clip/siglip) but LLAMA_STATIC_CRT does not reach the
        # cmake half - llama.cpp's own CMakeLists appears to override CMAKE_MSVC_RUNTIME_LIBRARY.
        # Until that is solved Windows keeps the server engine, so this build stays green and a
        # release can publish.
        # LLAMA_STATIC_CRT only reaches the CMAKE half of the build. The mtmd (vision) sources
        # are compiled by the `cc` crate instead, which never saw it and used /MD - producing
        # LNK2038 RuntimeLibrary mismatches on mtmd.o/clip.o/siglip.o/pixtral.o. CFLAGS/CXXFLAGS
        # force that half to /MT too, so every object agrees with Rust's static CRT.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package + checksum
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/sgl.exe"
          if (-not (Test-Path $bin)) { throw "sgl.exe was not produced at $bin" }
          Copy-Item $bin "sgl-windows-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "sgl-windows-x86_64.exe").Hash.ToLower()
          "$hash  sgl-windows-x86_64.exe" | Out-File -Encoding ascii "sgl-windows-x86_64.exe.sha256"
          Get-Content "sgl-windows-x86_64.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgl-windows-x86_64
          path: |
            sgl-windows-x86_64.exe
            sgl-windows-x86_64.exe.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Show checksums (paste these into the allowlist)
        run: cat ./*.sha256

      - name: Create prerelease with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "sgl-node $TAG" \
            --generate-notes \
            --prerelease \
            sgl-darwin-arm64 sgl-darwin-arm64.sha256 \
            sgl-linux-x86_64 sgl-linux-x86_64.sha256 \
            sgl-linux-arm64 sgl-linux-arm64.sha256 \
            sgl-windows-x86_64.exe sgl-windows-x86_64.exe.sha256
